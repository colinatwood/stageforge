name: Checkpoint 86 Engine Main Apply
on:
  pull_request:
    branches: [main]
    paths:
      - scripts/apply-checkpoint-86-engine-main.py
      - .github/workflows/checkpoint-86-engine-main-apply.yml
permissions:
  contents: write
jobs:
  apply:
    if: github.event.pull_request.head.ref == 'checkpoint-86-backlog-reconcile-and-audio-stream'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: checkpoint-86-backlog-reconcile-and-audio-stream
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/apply-checkpoint-86-engine-main.py
      - name: Commit deterministic integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add native/src/engine_main.cpp
          git diff --cached --quiet && exit 0
          git commit -m "Wire target-OS native audio into full engine"
          git push
