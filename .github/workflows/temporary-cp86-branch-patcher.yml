name: Temporary CP86 Branch Patcher
on:
  push:
    branches: [checkpoint-86-backlog-reconcile-and-audio-stream]
    paths:
      - scripts/checkpoint-86-trigger.txt
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: checkpoint-86-backlog-reconcile-and-audio-stream
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply deterministic integration
        run: |
          sed -i 's/if s.count(old) != 1:/if s.count(old) < 1:/' scripts/apply-checkpoint-86-engine-main.py
          python scripts/apply-checkpoint-86-engine-main.py
      - name: Commit engine integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add native/src/engine_main.cpp
          git diff --cached --quiet && exit 0
          git commit -m "Wire target-OS native audio into full engine"
          git push
